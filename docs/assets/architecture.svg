<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d">
  <title id="t">data-onboarding-transformation architecture</title>
  <desc id="d">dbt models on DuckDB read the raw Parquet that data-onboarding-ingestion lands in ADLS Gen2. Staging views read only the part files of the latest ingest_date snapshot, marts deduplicate and test the data and are written as Parquet to the curated zone. Airflow in data-onboarding-orchestration runs dbt build when a table's Asset is published; the local target uses a lake folder.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #14232C; }
    .bg { fill: #FFFFFF; }
    .zone { fill: #E7EEF0; }
    .zl { font-family: Consolas, "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.08em; fill: #586A75; }
    .box { fill: #FFFFFF; stroke: #C6D3D9; stroke-width: 1.2; }
    .hl { stroke: #0D776F; stroke-width: 1.6; }
    .dash { fill: none; stroke: #586A75; stroke-dasharray: 5 4; }
    .run { fill: #D3ECE8; stroke: #0D776F; stroke-dasharray: 6 4; }
    .row { fill: #E7EEF0; }
    .bt { font-size: 13px; font-weight: 600; }
    .rt { font-size: 12.5px; font-weight: 600; }
    .bs { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .edge { fill: none; stroke: #0D776F; stroke-width: 1.6; }
    .pre { stroke-dasharray: 5 4; }
    .aux { fill: none; stroke: #586A75; stroke-dasharray: 3 3; stroke-width: 1.2; }
    .ah { fill: #0D776F; }
    .ahm { fill: #586A75; }
    .badge { fill: #0D776F; }
    .badge-a { fill: #9A5B12; }
    .bn { fill: #FFFFFF; font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; }
    .el { font-family: Consolas, "JetBrains Mono", monospace; font-size: 10.5px; fill: #586A75; }
    .title { font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1240" height="560"/>
  <text class="title" x="20" y="28">data-onboarding-transformation</text>
  <text class="bs" x="20" y="44">raw Parquet → tested, analytics-ready Parquet · dbt on DuckDB (dbt-duckdb)</text>
  <rect class="zone" x="20" y="60" width="230" height="440" rx="10"/>
  <text class="zl" x="38" y="82">RAW ZONE · ADLS GEN2</text>
  <rect class="box" x="40" y="90" width="190" height="92" rx="8"/>
  <text class="bt" x="54" y="112">raw / parquet</text>
  <text class="bs" x="54" y="130">&lt;sys&gt;/&lt;schema&gt;/&lt;table&gt;/</text>
  <text class="bs" x="54" y="146">ingest_date=YYYY-MM-DD/</text>
  <text class="bs" x="54" y="162">part-* (one full snapshot)</text>
  <rect class="dash" x="40" y="200" width="190" height="70" rx="8"/>
  <text class="bt" x="54" y="222">_SUCCESS · _manifest</text>
  <text class="bs" x="54" y="240">_staging/</text>
  <text class="bs" x="54" y="256">never read by sources</text>
  <rect class="box" x="40" y="290" width="190" height="90" rx="8"/>
  <text class="bt" x="54" y="312">Written by</text>
  <text class="bs" x="54" y="330">data-onboarding-ingestion</text>
  <text class="bs" x="54" y="346">Flink job, published after</text>
  <text class="bs" x="54" y="362">the row count matches</text>
  <rect class="zone" x="290" y="60" width="560" height="440" rx="10"/>
  <text class="zl" x="308" y="82">DBT PROJECT · DUCKDB (dbt-duckdb)</text>
  <rect class="box" x="310" y="90" width="520" height="70" rx="8"/>
  <text class="bt" x="324" y="112">sources · _&lt;system&gt;__sources.yml</text>
  <text class="bs" x="324" y="130">read_parquet over part-* (DuckDB azure extension)</text>
  <rect class="box hl" x="310" y="176" width="520" height="80" rx="8"/>
  <text class="bt" x="324" y="198">staging · views</text>
  <text class="bs" x="324" y="216">stg_&lt;system&gt;__&lt;table&gt;.sql</text>
  <rect class="row" x="322" y="224" width="496" height="28" rx="6"/>
  <text class="rt" x="334" y="243">latest_snapshot() macro</text>
  <text class="bs" x="808" y="243" text-anchor="end">rows of the newest ingest_date</text>
  <rect class="box hl" x="310" y="272" width="520" height="80" rx="8"/>
  <text class="bt" x="324" y="294">marts · external Parquet</text>
  <text class="bs" x="324" y="312">crm_customers_current.sql …</text>
  <rect class="row" x="322" y="320" width="496" height="28" rx="6"/>
  <text class="rt" x="334" y="339">dedup · tests · docs</text>
  <text class="bs" x="808" y="339" text-anchor="end">_&lt;system&gt;__models.yml</text>
  <rect class="box" x="310" y="368" width="250" height="110" rx="8"/>
  <text class="bt" x="324" y="390">profiles.yml</text>
  <text class="bs" x="324" y="408">target local → .lake/</text>
  <text class="bs" x="324" y="424">target azure → ADLS Gen2</text>
  <text class="bs" x="324" y="440">secrets from env vars</text>
  <rect class="dash" x="580" y="368" width="250" height="110" rx="8"/>
  <text class="bt" x="594" y="390">working database</text>
  <text class="bs" x="594" y="408">.duckdb file</text>
  <text class="bs" x="594" y="424">disposable</text>
  <text class="bs" x="594" y="440">output lives in the lake</text>
  <rect class="zone" x="890" y="60" width="330" height="220" rx="10"/>
  <text class="zl" x="908" y="82">CURATED ZONE · ADLS GEN2</text>
  <rect class="box" x="910" y="90" width="290" height="70" rx="8"/>
  <text class="bt" x="924" y="112">curated / dbt / &lt;model&gt;.parquet</text>
  <text class="bs" x="924" y="130">dbt marts · analytics-ready</text>
  <rect class="dash" x="910" y="176" width="290" height="84" rx="8"/>
  <text class="bt" x="924" y="198">Consumers</text>
  <text class="bs" x="924" y="216">BI · analysts · data-onboarding-agent</text>
  <text class="bs" x="924" y="232">(reads the models to answer requests)</text>
  <rect class="zone" x="890" y="300" width="330" height="200" rx="10"/>
  <text class="zl" x="908" y="322">RUNS</text>
  <rect class="dash" x="910" y="330" width="290" height="70" rx="8"/>
  <text class="bt" x="924" y="352">Airflow · orchestration repo</text>
  <text class="bs" x="924" y="370">dags/transformation: dbt build</text>
  <text class="bs" x="924" y="386">--select source:&lt;sys&gt;+ on the Asset</text>
  <rect class="dash" x="910" y="414" width="290" height="70" rx="8"/>
  <text class="bt" x="924" y="436">CI · phase 4</text>
  <text class="bs" x="924" y="454">dbt build on a local lake</text>
  <text class="bs" x="924" y="470">in pull requests</text>
  <path class="edge" d="M230 136 H290 V125 H308" marker-end="url(#arr)"/>
  <path class="edge" d="M570 160 V174" marker-end="url(#arr)"/>
  <path class="edge" d="M570 256 V270" marker-end="url(#arr)"/>
  <path class="edge pre" d="M830 312 H860 V125 H908" marker-end="url(#arr)"/>
  <path class="aux" d="M910 365 H852" marker-end="url(#arrm)"/>
  <path class="aux" d="M910 449 H872 V367" marker-end="url(#arrm)"/>
  <path class="aux" d="M435 368 V354" marker-end="url(#arrm)"/>
  <circle class="badge" cx="270" cy="125" r="10"/><text class="bn" x="270" y="129">1</text>
  <circle class="badge" cx="570" cy="167" r="10"/><text class="bn" x="570" y="171">2</text>
  <circle class="badge" cx="570" cy="263" r="10"/><text class="bn" x="570" y="267">3</text>
  <circle class="badge" cx="860" cy="125" r="10"/><text class="bn" x="860" y="129">4</text>
  <text class="bs" x="20" y="530">1 read the newest snapshot · 2 staging views · 3 marts with tests · 4 write curated Parquet; Airflow (Asset) or CI starts the build</text>
</svg>

version: 2

sources:
  - name: crm
    description: >
      CRM tables landed by data-onboarding-ingestion from SQL Server (connection crm-sqlserver-nonprod), one full
      snapshot per ingest day. Only `part-*` files are read, so the `_SUCCESS` / `_manifest.json` markers
      and unpublished `_staging/` output are never picked up.
    config:
      meta:
        # LAKE_RAW_ROOT: e.g. abfss://raw@<account>.dfs.core.windows.net/parquet; {name} = table name.
        external_location: >-
          read_parquet('{{ env_var("LAKE_RAW_ROOT", ".lake/raw/parquet") }}/sqlserver/crm/{name}/*/part-*', hive_partitioning = true)
    tables:
      - name: customers
        description: "Ingestion job sqlserver-crm-customers-manual: dbo.customers (full snapshot, deletes included)."
        columns:
          - name: customer_id
          - name: full_name
          - name: email
          - name: segment_id
          - name: is_deleted
          - name: created_at
          - name: updated_at
          - name: ingest_date
            description: Hive partition of the landing; one snapshot per day.
          - name: _ingest_run_id
          - name: _ingested_at

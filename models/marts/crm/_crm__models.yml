version: 2

models:
  - name: crm_customers_current
    description: >
      Current CRM customers (latest snapshot). Written to
      `<external_root>/crm_customers_current.parquet` in the transformation container.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: full_name
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

  - name: crm_active_customers_by_segment
    description: >
      Active (non-deleted) customers per segment (latest snapshot). Written to
      `<external_root>/crm_active_customers_by_segment.parquet` in the transformation container.
    columns:
      - name: segment_id
        data_tests: [unique, not_null]
      - name: customer_count
        data_tests: [not_null]

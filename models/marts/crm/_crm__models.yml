version: 2

models:
  - name: crm_customers_current
    description: >
      Current CRM customers (latest snapshot). Written to
      `<external_root>/crm_customers_current.parquet` in the curated zone.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: full_name
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]

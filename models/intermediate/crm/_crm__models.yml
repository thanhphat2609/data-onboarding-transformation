version: 2

models:
  - name: int_crm__customers_current
    description: Latest snapshot of CRM customers, one row per customer.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment_id
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]

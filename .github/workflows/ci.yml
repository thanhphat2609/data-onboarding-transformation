# Checks on every pull request and every push to main. Nothing is deployed here; a green run on main is what the
# Deploy workflow waits for. Same flow as data-onboarding-orchestration (its ADR-0012).
#
# dbt parse only: it builds the manifest (every model, source and test file is valid Jinja/YAML, every ref/source
# resolves) without connecting to a warehouse, so it runs with no Azure credentials and no real data. It will not
# catch a SQL error that only appears when a query actually runs against DuckDB.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dbt-parse:
    name: dbt parse (project only, no warehouse)
    runs-on: ubuntu-24.04
    env:
      DBT_TARGET: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p .lake/curated   # DuckDB does not create the external_root folder itself
      - run: dbt parse
